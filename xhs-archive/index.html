<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XHS 笔记repo · syu-toutousai</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1c2333;--sub:#5b6478;--acc:#ff2e4d;--acc2:#ffecef}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,#c2255c,#ff2e4d 60%,#ff7a45);color:#fff;padding:52px 20px 60px;text-align:center}
header h1{font-size:28px;letter-spacing:2px}
header p{opacity:.92;font-size:14.5px;margin-top:10px}
main{max-width:920px;width:100%;margin:-34px auto 0;padding:0 16px 40px;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.site{background:var(--card);border-radius:20px;padding:28px 24px;display:flex;flex-direction:column;text-decoration:none;color:var(--ink);
box-shadow:0 6px 24px rgba(30,40,90,.12);transition:.2s;border:2px solid transparent}
.site:hover{transform:translateY(-4px);border-color:var(--acc)}
.site .em{font-size:44px;line-height:1}
.site h2{font-size:21px;margin:14px 0 2px}
.site .jp{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;color:var(--acc);font-size:13px;font-weight:700}
.site .desc{font-size:13.5px;color:var(--sub);line-height:1.85;margin:12px 0 16px;flex:1}
.chips span{display:inline-block;background:var(--acc2);color:var(--acc);
border-radius:99px;padding:3px 11px;font-size:11.5px;margin:0 5px 6px 0;font-weight:600}
.go{display:block;text-align:center;background:var(--acc);color:#fff;border-radius:12px;padding:11px 0;font-size:15px;font-weight:700;margin-top:6px}
footer{text-align:center;font-size:12px;color:var(--sub);padding:18px;line-height:1.9}
footer a{color:var(--sub)}
@media (max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>XHS 笔记repo ・ 小红书笔记镜像</h1>
  <p>把自己发在小红书的笔记 & 评论存档到这里，带时间戳，可检索可回溯</p>
</header>

<main>
  <div class="grid">
    <a class="site" href="2025-11-九条の大罪/">
      <div class="em">🗂️</div>
      <h2>2025年11月「九条の大罪」</h2>
      <div class="jp">こ く じ ょ う の た い ざ い</div>
      <div class="desc">11月的阅读 / 观影清单：漫画、动画、剧集逐条记录，
        正文与评论区持续追加「九条の大罪」相关的作品条目。
        71 条评论（含作者自加条目）全部带时间戳存档。</div>
      <div class="chips"><span>71 条评论</span><span>带时间戳</span><span>作者自述清单</span></div>
      <div class="go">打开笔记 →</div>
    </a>
  </div>
</main>

<footer>
  源仓库：<a href="https://github.com/syu-toutousai/syu-toutousai.github.io">syu-toutousai.github.io</a>
</footer>
</body>
</html>
