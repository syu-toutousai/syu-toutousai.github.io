<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>(无标题)  · XHS 笔记repo</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1c2333;--sub:#5b6478;--acc:#ff2e4d;--acc2:#ffecef}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,#c2255c,#ff2e4d 60%,#ff7a45);color:#fff;padding:36px 20px 52px;text-align:center}
header .crumb{font-size:13px;opacity:.88;margin-bottom:10px}
header .crumb a{color:#fff}
header h1{font-size:23px;letter-spacing:1px}
header p{opacity:.92;font-size:13.5px;margin-top:10px}
main{max-width:760px;width:100%;margin:-26px auto 0;padding:0 16px 40px;flex:1}
.card{background:var(--card);border-radius:20px;padding:24px;box-shadow:0 6px 24px rgba(30,40,90,.12);margin-bottom:18px}
.note-img{width:100%;border-radius:12px;margin-bottom:12px}
.note-meta{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.note-ava{width:44px;height:44px;border-radius:50%;background:var(--acc2);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--acc)}
.note-meta .nm{font-weight:700}
.note-meta .nsm{font-size:12.5px;color:var(--sub);margin-top:2px}
.note-desc{font-size:15px;line-height:1.9;margin-bottom:14px;white-space:pre-wrap}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--sub);padding-top:12px;border-top:1px solid #eee}
.stats b{color:var(--ink)}
.h2{font-size:17px;margin:22px 0 4px;font-weight:700}
.h2 small{font-weight:400;color:var(--sub);font-size:13px}
.comment{padding:14px 16px;border-radius:14px;background:var(--bg);margin-bottom:10px}
.comment-sub{margin-left:34px;border-left:3px solid var(--acc);border-radius:4px 14px 14px 4px}
.c-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;font-size:12.5px}
.c-name{font-weight:700;color:var(--acc)}
.tag{background:var(--acc);color:#fff;font-size:11px;padding:1px 7px;border-radius:99px;font-weight:600}
.c-date{color:var(--sub)}
.c-loc{color:var(--sub);font-size:12px}
.c-like{color:#e05a6a;font-size:12px}
.c-body{font-size:14px;line-height:1.75;word-break:break-word}
footer{text-align:center;font-size:12px;color:var(--sub);padding:18px;line-height:1.9}
footer a{color:var(--sub)}
.rawlink{display:inline-block;margin-top:10px;font-size:12.5px;color:var(--acc)}
@media (max-width:700px){header h1{font-size:19px}}
</style>
</head>
<body>
<header>
  <div class="crumb"><a href="../">XHS 笔记repo</a> · (无标题)</div>
  <h1>(无标题)</h1>
  <p>小红书笔记镜像 · 2025-10-07 04:25:05 · 0 条评论</p>
</header>

<main>
  <div class="card">
    <img class="note-img" src="images/img1.jpg" alt="" loading="lazy">
    <div class="note-meta">
      <div class="note-ava">高</div>
      <div><div class="nm">高龄少年</div><div class="nsm">2025-10-07 04:25:05 · 发布</div></div>
    </div>
        <div class="note-desc">いざよいのつき</div>
    
    <div class="stats">
      <span>❤️ <b>1</b></span>
      <span>⭐ <b></b></span>
      <span>💬 <b></b></span>
      <span>🔗 <b></b></span>
    </div>
    <a class="rawlink" href="data.json">机读数据 data.json</a>
  </div>
  
</main>

<footer>
  源笔记：<a href="https://www.xiaohongshu.com/explore/68e49621000000000703accd">小红书原文</a> · 本页为静态镜像 · <a href="../">返回 XHS 笔记repo</a>
</footer>
</body>
</html>
